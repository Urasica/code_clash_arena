name: Release Gate

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-contract:
    uses: ./.github/workflows/release-contract.yml
    with:
      source_sha: ${{ github.sha }}
