name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-regression:
    name: Fast regression (${{ matrix.os }})
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Terraform for network contract tests
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: OCI network configuration tests (no cloud credentials)
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/oci/network fmt -check -recursive
          terraform -chdir=infra/oci/network init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/oci/network validate -no-color
          terraform -chdir=infra/oci/network test -no-color

      - name: Backend tests (Linux)
        if: runner.os != 'Windows'
        working-directory: backend/code
        run: sh mvnw test -q

      - name: Backend tests (Windows)
        if: runner.os == 'Windows'
        working-directory: backend/code
        shell: pwsh
        run: .\mvnw.cmd test -q

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm run audit

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Engine unit tests
        run: python -m unittest engine.tests.test_land_grab engine.tests.test_referee -v
