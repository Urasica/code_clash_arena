spring:
  config:
    import: optional:configtree:${CCA_DATA_SECRETS_DIR:/run/secrets/backend/}
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/code_arena?sslMode=REQUIRED&allowPublicKeyRetrieval=false&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}

management:
  server:
    address: 127.0.0.1
