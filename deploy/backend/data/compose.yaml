name: ${DATA_PROJECT_NAME:-cca-data}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: code_arena
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
      TZ: UTC
    entrypoint: ["sh", "/usr/local/bin/cca-mysql-entrypoint"]
    command: ["mysqld", "--defaults-extra-file=/tmp/cca.cnf"]
    ports:
      - name: mysql-loopback
        target: 3306
        host_ip: 127.0.0.1
        published: "${MYSQL_HOST_PORT:-3306}"
        protocol: tcp
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/cca.cnf:/opt/cca/cca.cnf:ro
      - ./mysql/entrypoint.sh:/usr/local/bin/cca-mysql-entrypoint:ro
      - ./mysql/bootstrap-users.sh:/docker-entrypoint-initdb.d/10-bootstrap-users.sh:ro
      - ./health/mysql-health.sh:/usr/local/bin/cca-mysql-health:ro
      - ./health/mysql-client.sh:/usr/local/bin/cca-mysql-client:ro
    secrets:
      - mysql-root-password
      - mysql-app-password
      - mysql-migration-password
      - mysql-backup-password
      - mysql-health-password
      - mysql-app-client
      - mysql-migration-client
      - mysql-backup-client
      - mysql-health-client
    networks: [data-internal]
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/cca-mysql-health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    labels:
      io.codeclash.data-role: mysql
      io.codeclash.data-purpose: ${DATA_PURPOSE:-service}

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/cca-redis-entrypoint"]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--aclfile", "/tmp/cca-redis-secrets/redis.acl"]
    ports:
      - name: redis-loopback
        target: 6379
        host_ip: 127.0.0.1
        published: "${REDIS_HOST_PORT:-6379}"
        protocol: tcp
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/entrypoint.sh:/usr/local/bin/cca-redis-entrypoint:ro
      - ./health/redis-health.sh:/usr/local/bin/cca-redis-health:ro
      - ./health/redis-cli.sh:/usr/local/bin/cca-redis-cli:ro
    secrets:
      - redis-acl
      - redis-app-password
    networks: [data-internal]
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/cca-redis-health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_READ_SEARCH", "SETGID", "SETUID"]
    labels:
      io.codeclash.data-role: redis
      io.codeclash.data-purpose: ${DATA_PURPOSE:-service}

networks:
  data-internal:
    internal: true
    attachable: false

volumes:
  mysql-data:

secrets:
  mysql-root-password:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/mysql-root-password
  mysql-app-password:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/mysql-app-password
  mysql-migration-password:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/mysql-migration-password
  mysql-backup-password:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/mysql-backup-password
  mysql-health-password:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/mysql-health-password
  mysql-app-client:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/mysql-app.cnf
  mysql-migration-client:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/mysql-migration.cnf
  mysql-backup-client:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/mysql-backup.cnf
  mysql-health-client:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/mysql-health.cnf
  redis-acl:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/redis.acl
  redis-app-password:
    file: ${DATA_SECRETS_DIR:?Set DATA_SECRETS_DIR}/redis-app-password
