map $http_upgrade $cca_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name app.cca.internal;

    ssl_certificate /etc/pki/code-clash-arena/application/fullchain.pem;
    ssl_certificate_key /etc/pki/code-clash-arena/application/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~ ^/actuator(?:/|$) {
        return 404;
    }

    location ~ ^/(?:api(?:/|$)|oauth2/authorization(?:/|$)|login/oauth2/code(?:/|$)|ws-stomp(?:/|$)) {
        if ($http_x_forwarded_proto != "https") { return 400; }
        if ($http_x_forwarded_host = "") { return 400; }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_x_forwarded_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cca_connection_upgrade;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }

    location / {
        return 404;
    }
}
