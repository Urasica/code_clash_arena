map $http_upgrade $cca_connection_upgrade {
    default upgrade;
    '' close;
}

upstream cca_private_application {
    server app.cca.internal:8443;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __CCA_PUBLIC_HOSTNAME__;
    if ($host != __CCA_PUBLIC_HOSTNAME__) { return 444; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __CCA_PUBLIC_HOSTNAME__;
    if ($host != __CCA_PUBLIC_HOSTNAME__) { return 444; }

    ssl_certificate /etc/pki/code-clash-arena/public/fullchain.pem;
    ssl_certificate_key /etc/pki/code-clash-arena/public/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/code-clash-arena/frontend/current/build;
    index index.html;

    location ~ ^/actuator(?:/|$) {
        return 404;
    }

    location ~ ^/(?:api(?:/|$)|oauth2/authorization(?:/|$)|login/oauth2/code(?:/|$)|ws-stomp(?:/|$)) {
        proxy_pass https://cca_private_application;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cca_connection_upgrade;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;

        proxy_ssl_server_name on;
        proxy_ssl_name app.cca.internal;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/pki/code-clash-arena/internal/ca.pem;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
